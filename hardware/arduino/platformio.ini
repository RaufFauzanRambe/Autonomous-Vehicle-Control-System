; =============================================================================
;  platformio.ini  —  PlatformIO configuration for the Autonomous Vehicle
;                      Control System (AVCS) Arduino firmware.
; -----------------------------------------------------------------------------
;  This file declares FOUR build environments covering the most common
;  Arduino-compatible boards used in hobbyist & academic autonomous-vehicle
;  projects.  Select the appropriate environment by passing `-e <envname>` to
;  the `pio` command, or by changing the `default_envs` list below.
;
;  Author    : AVCS Team
;  Created   : 2025
;  License   : MIT
; =============================================================================

[platformio]
; Default environment(s) built when `pio run` is invoked without -e
default_envs  = mega2560
; Search for shared libraries one level up
boards_dir    = ./boards
include_dir   = .
src_dir       = languages
data_dir      = data
test_dir      = test

; -----------------------------------------------------------------------------
;  Common settings shared by every environment
; -----------------------------------------------------------------------------
[common]
build_flags =
    -DTASK_ARDUINO=1
    -DARDUINO_ARCH_AVR=1
    -DDEBUG=1
    -Wall -Wextra -Wno-unused-parameter
    -std=gnu++17
lib_deps =
    arduino-libraries/Servo @ ^1.2.2
    arduino-libraries/Wire  @ ^1.0
    arduino-libraries/SPI   @ ^1.0
    bblanchon/ArduinoJson   @ ^6.21.5
    br3ttb/PID              @ ^1.2.1
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    mikalhart/TinyGPSPlus   @ ^1.0.3
lib_ldf_mode = deep+
monitor_speed = 115200
monitor_filters = colorize, time

; -----------------------------------------------------------------------------
;  Environment: Arduino Uno (entry-level reference target)
; -----------------------------------------------------------------------------
[env:uno]
platform    = atmelavr
board       = uno
framework   = arduino
build_flags = ${common.build_flags} -DBOARD_UNO
lib_deps    = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_protocol = arduino
upload_speed     = 115200

; -----------------------------------------------------------------------------
;  Environment: Arduino Mega 2560 (DEFAULT — recommended for AVCS)
; -----------------------------------------------------------------------------
[env:mega2560]
platform    = atmelavr
board       = megaatmega2560
framework   = arduino
build_flags = ${common.build_flags} -DBOARD_MEGA_2560 -DSerial1_GPS
lib_deps    = ${common.lib_deps}
monitor_speed   = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_protocol = arduino
upload_speed    = 115200
board_build.f_cpu = 16000000L
board_build.variant = mega

; -----------------------------------------------------------------------------
;  Environment: Arduino Due (32-bit ARM Cortex-M3, CAN-bus capable)
; -----------------------------------------------------------------------------
[env:due]
platform    = atmelsam
board       = due
framework   = arduino
build_flags = ${common.build_flags} -DBOARD_DUE -DARDUINO_ARCH_SAM -DHAS_CAN_BUS
lib_deps    = ${common.lib_deps}
            collin80/due_can @ ^1.3.2
monitor_speed   = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_protocol = sam-ba
upload_port     = /dev/ttyACM0

; -----------------------------------------------------------------------------
;  Environment: Arduino Nano 33 IoT (SAMD21, onboard IMU + WiFi/BT)
; -----------------------------------------------------------------------------
[env:nano33iot]
platform    = atmelsam
board       = nano_33_iot
framework   = arduino
build_flags = ${common.build_flags} -DBOARD_NANO_33_IOT -DARDUINO_ARCH_SAMD
              -DUSE_BUILTIN_IMU=1
lib_deps    = ${common.lib_deps}
monitor_speed   = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_protocol = sam-ba

; -----------------------------------------------------------------------------
;  Environment overrides for unit-testing on PC (native)
; -----------------------------------------------------------------------------
[env:native]
platform    = native
build_flags = -DTEST_NATIVE -std=gnu++17 -Wall -Wextra
             -I./languages -I.
src_filter  = +<*> -<.git/> -<examples/>
lib_deps    =
