; =============================================================================
;  platformio.ini  —  Autonomous Vehicle Control System / ESP32 platform
; =============================================================================
;  Builds the same source tree for three ESP32 variants:
;    - esp32dev           (classic ESP-WROOM-32, Arduino framework)
;    - esp32-s3-devkitc   (ESP32-S3 DevKitC-1, Arduino framework + PSRAM)
;    - esp32-c3-devkitm-1 (ESP32-C3 DevKitM-1, Arduino framework)
;
;  The ESP-IDF framework is also supported via the `[env:esp32-s3-idf]`
;  environment for users who prefer a pure ESP-IDF workflow.
;
;  Author: AVC team   |  License: MIT   |  Date: 2024
; =============================================================================

[platformio]
default_envs   = esp32dev
boards_dir     =
extra_configs  =
include_dir    = include
lib_dir        = lib
src_dir        = src
test_dir       = test
data_dir       = data
build_cache_dir= .pio/cache

; -----------------------------------------------------------------------------
;  Common flags shared by every environment
; -----------------------------------------------------------------------------
[common]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ARCH_ESP32=1
    -DASYNC_TCP_SSL_ENABLED=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DBOARD_HAS_PSRAM=0
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    knolleary/PubSubClient@^2.8
    me-no-dev/ESPAsyncWebServer@^1.2.7
    me-no-dev/AsyncTCP@^1.1.4
    alanswx/ESPAsyncWiFiManager@^0.41
    adafruit/Adafruit BNO055@^1.6.3
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit VL53L0X@^1.2.3
lib_ldf_mode = chain+
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize, time
upload_speed  = 921600

; -----------------------------------------------------------------------------
;  Environment 1 — classic ESP32 (ESP-WROOM-32 DevKit v1)
; -----------------------------------------------------------------------------
[env:esp32dev]
platform            = espressif32@^6.5.0
board               = esp32dev
framework           = arduino
board_build.f_cpu   = 240000000L
board_build.flash_mode = dio
board_build.partitions = partitions/partitions.csv
build_flags         =
    ${common.build_flags}
    -DCONFIG_IDF_TARGET_ESP32=1
    -DARDUINO_USB_MODE=1
lib_deps            = ${common.lib_deps}
monitor_speed       = ${common.monitor_speed}
monitor_filters     = ${common.monitor_filters}
upload_speed        = ${common.upload_speed}
extra_scripts       = pre:tools/pre_build.py

; -----------------------------------------------------------------------------
;  Environment 2 — ESP32-S3 DevKitC-1 (with PSRAM, 8 MB flash)
; -----------------------------------------------------------------------------
[env:esp32-s3-devkitc]
platform            = espressif32@^6.5.0
board               = esp32-s3-devkitc-1
board_build.variant = esp32s3
framework           = arduino
board_build.f_cpu   = 240000000L
board_build.flash_mode = dio
board_build.partitions = partitions/partitions_s3.csv
board_build.arduino.memory_type = qio_opi
build_flags         =
    ${common.build_flags}
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps            = ${common.lib_deps}
monitor_speed       = ${common.monitor_speed}
monitor_filters     = ${common.monitor_filters}
upload_speed        = 1500000
board_upload.flash_size = 8MB

; -----------------------------------------------------------------------------
;  Environment 3 — ESP32-C3 DevKitM-1 (RISC-V, 4 MB flash)
; -----------------------------------------------------------------------------
[env:esp32-c3-devkitm-1]
platform            = espressif32@^6.5.0
board               = esp32-c3-devkitm-1
framework           = arduino
board_build.f_cpu   = 160000000L
board_build.flash_mode = dio
board_build.partitions = partitions/partitions_c3.csv
build_flags         =
    ${common.build_flags}
    -DCONFIG_IDF_TARGET_ESP32C3=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps            = ${common.lib_deps}
monitor_speed       = ${common.monitor_speed}
monitor_filters     = ${common.monitor_filters}
upload_speed        = 1500000

; -----------------------------------------------------------------------------
;  Environment 4 — ESP32-S3 with native ESP-IDF framework (advanced users)
; -----------------------------------------------------------------------------
[env:esp32-s3-idf]
platform            = espressif32@^6.5.0
board               = esp32-s3-devkitc-1
framework           = espidf
board_build.f_cpu   = 240000000L
board_build.partitions = partitions/partitions_s3.csv
build_flags         =
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -DBOARD_HAS_PSRAM=1
lib_deps            =
    bblanchon/ArduinoJson@^6.21.5
    knolleary/PubSubClient@^2.8
monitor_speed       = ${common.monitor_speed}
monitor_filters     = ${common.monitor_filters}
upload_speed        = 1500000

; -----------------------------------------------------------------------------
;  OTA upload targets — use via:
;    pio run -e esp32-s3-devkitc -t upload --upload-port 192.168.1.42
; -----------------------------------------------------------------------------
[env:esp32dev_ota]
extends         = env:esp32dev
upload_protocol = espota
upload_port     = 192.168.1.42
upload_flags    = --auth=avc-ota-secret --port=3232
