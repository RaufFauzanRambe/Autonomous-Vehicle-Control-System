# Scenario definition for the 08_full_system_demo pipeline.
# Relative paths in configs are resolved against the module directory (08_full_system_demo/).
name: "parking"              # [-] scenario identifier used for log and result file names
speed_limit_mps: 2.0         # [m/s] parking speed limit, typical 1-3
traffic_density: "none"      # [-] label consumed by synthetic perception, typical none/low/medium/high
start: {x: 0.0, y: 0.0, yaw: 0.0, speed: 1.0}   # [m], [m], [rad], [m/s] initial ego pose and speed
goal: {x: 15.0, y: 0.0}      # [m] target position, typical 5-30 m ahead
weather: {condition: "clear", visibility_m: 50.0}   # [-] condition label, [m] visibility, typical 50-1000
maneuver: "parallel_parking" # [-] maneuver label consumed by planning extensions, typical parallel_parking/vertical_parking
