# Scenario definition for the 08_full_system_demo pipeline.
# Relative paths in configs are resolved against the module directory (08_full_system_demo/).
name: "urban"                # [-] scenario identifier used for log and result file names
speed_limit_mps: 12.0        # [m/s] urban speed limit, typical 8-15
traffic_density: "medium"    # [-] label consumed by synthetic perception, typical none/low/medium/high
start: {x: 0.0, y: 0.0, yaw: 0.0, speed: 5.0}   # [m], [m], [rad], [m/s] initial ego pose and speed
goal: {x: 180.0, y: 0.0}     # [m] target position, typical 50-500 m ahead
weather: {condition: "clear", visibility_m: 200.0}  # [-] condition label, [m] visibility, typical 50-1000
