# Scenario definition for the low-speed parking maneuver case.
# Loaded by 06_motion_control_simulation/main.py; the scenario file lives in
# the module-relative folder configured under scenarios.directory.
name: "parking"                                          # [-] scenario identifier, used for output file names
duration_s: 25.0                                         # [s] maximum simulated wall-clock duration, typical 10-60
initial_state: {x: 0.0, y: 0.0, yaw: 0.0, speed: 0.0}    # [m], [m], [rad], [m/s] vehicle pose and speed at t=0
path: {type: "straight", heading_rad: 0.0, length_m: 20.0}  # [-], [rad], [m] reference geometry
target_speed_mps: 1.5                                    # [m/s] speed PID setpoint, low-speed maneuver
